<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="With great power comes great responsibility. Uncle Ben, Spider-Man">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090E1D"/>
      <stop offset="1" stop-color="#111B3E"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F87171"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="glowR" gradientUnits="userSpaceOnUse" cx="90" cy="30" r="340">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" gradientUnits="userSpaceOnUse" cx="780" cy="270" r="360">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="900" height="280" rx="26"/></clipPath>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .a1 { animation: rise .8s ease-out .1s both; }
      .a2 { animation: rise .8s ease-out .35s both; }
      .a3 { animation: rise .8s ease-out .6s both; }
    </style>
  </defs>

